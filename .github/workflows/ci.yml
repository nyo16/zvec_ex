name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MIX_ENV: test
  # Always build the NIF from the checked-out C++ source, never a precompiled release.
  ZVEC_BUILD: "true"
  ELIXIR_VERSION: "1.18"
  OTP_VERSION: "27"

jobs:
  compile:
    name: Compile & Warnings
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Install cmake
        run: brew install cmake

      - name: Cache deps & build
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - run: mix deps.get
      - run: mix deps.compile

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

  format:
    name: Formatting
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps
        uses: actions/cache@v5
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - run: mix deps.get
      - run: mix format --check-formatted

  test:
    name: Tests (macos-14 / OTP ${{ matrix.otp }} / Elixir ${{ matrix.elixir }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.18"
            otp: "27"
          - elixir: "1.17"
            otp: "26"
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Install cmake
        run: brew install cmake

      - name: Cache deps & build
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      - run: mix deps.get
      - run: mix deps.compile
      - run: mix compile
      - run: mix test

  test-linux:
    name: Tests (ubuntu-24.04 / OTP 27 / Elixir 1.18, incl. RaBitQ)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "27"

      # zvec needs CMake >= 3.26; Ubuntu 24.04 ships 3.28.
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libbz2-dev zlib1g-dev

      - name: Cache deps & build
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: linux-mix-1.18-27-${{ hashFiles('mix.lock') }}
          restore-keys: |
            linux-mix-1.18-27-

      # A cold zvec build (arrow + rocksdb) takes 10-15 min; the Makefile pins
      # ZVEC_VERSION, so its hash identifies the vendored build.
      - name: Cache zvec vendor build
        uses: actions/cache@v5
        with:
          path: c_src/zvec_vendor
          key: linux-zvec-vendor-${{ hashFiles('Makefile') }}

      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix test --include rabitq
